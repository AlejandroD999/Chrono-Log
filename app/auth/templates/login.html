{% extends "layout.html" %}


{% block content %}

    <div class="index_div">
        <form action="/login" method="post">
            <h1 class="auth_headers">Log in</h1>
            
            <input required class="auth_fields" autocomplete="off" autofocus name="username" placeholder="Username" type="text">
            <br>
            <input required class="auth_fields" autocomplete="off" autofocus name="password" placeholder="Password" type="password">
            <p class="auth_transition">Don't have an account? <a href="{{ url_for('auth.signup')}}">Sign up</a></p>
            <button class="auth_buttons" type="submit">continue</button>

        </form>
    </div>

{% endblock %}
