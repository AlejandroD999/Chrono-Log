{% extends "home_layout.html" %}

{% block body %}
<div class="container_layout">
    <aside id="content_sidebar">
        <navbar class="sidebar_options">
            <ul>
                <li><a onclick="showNewSummaryForm()">
                    <img src="/static/images/new_icon.png" alt="new">
                </a></li>
            </ul>
        </navbar>
        <nav class="summaries_navbar">        
            <ul>
                {% for summary in summaries %}
                    <li>
                        <a  data-id="{{ summary['id'] }}"data-title="{{ summary['title'] }}" data-date="{{ summary['date'] }}"
                                data-summary="{{ summary['summary'] }}"
                            onclick="showSummary(this.dataset.id, this.dataset.title, this.dataset.date, this.dataset.summary)">
                                {{ summary['title'] }} | {{ summary['date'] }}
                        </a>
            
                    <form class="button-form" action="/del-summary" method="POST">
                        <input type="hidden" name="summary_id" value="{{ summary['id']}}">
                        <button class= "delete-button" type="submit">
                            <img src="/static/images/delete_icon.png" alt="X">
                        </button>
                    </form>

                    </li>

                {% endfor %}



            </ul>
        </nav>
    </aside>

    <section id="content_section">
        <form class="section_form" action="/update-summary" method=post>
            
            <input type="text" autofocus autocomplete="off" class="section_title" name="section_title">
            <input type="date" name="section_date" class="section_date">
            <button type="submit">Save</button>

            <div class="section_doc" contenteditable="true"></div>
            <input type="hidden" id="section_summary_id" name="section_summary_id">
            <input type="hidden" id="section_input" name="section_input">

        </form>
    </section>

    <section class="new_summary_section">
        <form class='new_summary_form' action="/new-summary" method=post>
            <div class="summary_header">
                <input autofocus autocomplete="off" id="summary_title" name="summary_title" placeholder="Title" type="text">
                <input required id="new_date" name="summary_date" type="date">
                <button type="submit">Submit</button>
            </div>

            <div class="summary_doc"  contenteditable="true" placeholder="Enter your text..."></div>
            <input type="hidden" name="summary_doc" id="summary_doc_input">

        </form>
    </section>

<script>
        const new_summary_form = document.querySelector(".new_summary_form");
        const section_form = document.querySelector(".section_form");

        if (new_summary_form) {
            new_summary_form.addEventListener('submit', (e) => {
                e.preventDefault();

                const source = document.querySelector(".summary_doc");
                const target = document.getElementById("summary_doc_input");

                if (!target || !source) return;

                target.innerHTML = sanitize(source.innerHTML);
                new_summary_form.submit();
            })
        }

        if (section_form) {
            section_form.addEventListener('submit', (e) => {
                e.preventDefault();

                const source = document.querySelector('.section_doc');
                const target = document.getElementById('section_input');

                if (!source || !target) return;
                
                target.value = sanitize(source.innerHTML);
                section_form.submit();
            })
        }
        function sanitize(html)
            {
                const template = document.createElement("template");

                template.innerHTML = html;

                template.content.querySelectorAll("script").forEach(el => el.remove());

                return template.innerHTML;
            };

</script>

</div>

    <script>
        function showSummary(id, title, date, text) {
            const content_section = document.getElementById("content_section");
            const section_summary_id = document.getElementById("section_summary_id");
            const section_title = document.querySelector(".section_title");
            const section_date = document.querySelector(".section_date");
            const section_doc = document.querySelector(".section_doc");
            const form_section = document.querySelector(".new_summary_section");
            
            form_section.style.display = 'none';
            content_section.style.display = 'block';
    
            section_summary_id.value = id;
            section_title.value = title;
            section_date.value = date;
            section_doc.innerHTML = text;
            }        
            
        function showNewSummaryForm()
        {
            const content_section = document.getElementById("content_section");
            const form_section = document.querySelector(".new_summary_section");

            content_section.style.display = 'none';
            form_section.style.display = 'block';
        

        }


</script>

{% endblock %}
